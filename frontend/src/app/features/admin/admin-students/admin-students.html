<div class="main-divisor">
    <div class="student-info">
        <h2>Informació de l'alumne</h2>
        <p>Email: {{ currentStudent()?.mail }}</p>
        <p>Nom: {{ currentStudent()?.name }}</p>
       
    </div>
    <div class="students-list">
        <h2>Llista d'alumnes</h2>
        <ul>
            @for (student of (students | async); track student.mail) {
            <li (click)="selectStudent(student)" [class.selected]="currentStudent() === student">
                {{ student.mail }},
                {{ student.name }}
            </li>
            }
        </ul>
        <div class="actions">
            <button (click)="addStudent()">Afegir</button>
            <button (click)="deleteStudent()">Eliminar</button>
        </div>
    </div>
