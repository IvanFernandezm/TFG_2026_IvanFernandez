<div class="form-docent">
    <h2>Registrar docent</h2>
    <form (submit)="submit()">
        <label for="email">Email:</label>
        <input id="email" type="email" name="email" required [attr.value]="newDocent()?.email">

        <label for="name">Nom:</label>
        <input id="name" type="text" name="name" required [attr.value]="newDocent()?.name">

        <label>Especialitats:</label>
        <div class="spec-options-container">
            @for (option of specOptions; track option) {
            <mat-checkbox 
                [checked]="isSpecSelected(option)"
                (change)="toggleSpec(option)">
                {{ option }}
            </mat-checkbox>
            }
        </div>

        <div class="actions">
            <button type="submit">Afegir</button>
            <button type="button" (click)="close()">Cancelar</button>
        </div>
    </form>
