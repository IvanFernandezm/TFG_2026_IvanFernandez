<div class="update-form">
    <h2>Actualitzar docent</h2>
    <form (submit)="submit()">
        <label for="email">Email:</label>
        <p id="email" name="email">{{ docentUpdate().mail }}</p>

        <label for="name">Nom:</label>
        <input id="name" name="name" [ngModel]="docentUpdate().name"
            (ngModelChange)="updateName($event)">

        <label>Especialitats:</label>
        <div class="display-options-container">
            @for (specOption of specOptions(); track specOption.id) {
            <mat-checkbox 
                [checked]="isSpecSelected(specOption)"
                (change)="toggleSpec(specOption)">
                {{ specOption.id }}
            </mat-checkbox>
            }
        </div>

        <label>Disponibilitats:</label>
        <div class="display-options-container">
            @for (dispOption of dispOptions(); track dispOption.timestamp) {
            <mat-checkbox 
                [checked]="isDispSelected(dispOption.timestamp)"
                (change)="toggleDisp(dispOption.timestamp)">
                {{ dispOption.timestamp| date:'dd/MM/yyyy HH:mm' }}
            </mat-checkbox>
            }
        </div>

        <div class="actions">
            <button type="submit">Actualitzar</button>
            <button type="button" (click)="close()">Cancelar</button>
        </div>
    </form>
</div>
