<div class="update-form">
    <h2>Editar Tribunal</h2>
    <form (ngSubmit)="onSubmit()">
        <label for="estudiant">Estudiant:</label>
        <input id="estudiant" disabled [ngModel]="tribUpdate().estudiant" name="estudiant" />

        <label for="TFGTitol">TFG Títol:</label>
        <input id="TFGTitol" [ngModel]="tribUpdate().TFGTitol"
            (ngModelChange)="updateField('TFGTitol', $event)" name="TFGTitol" />

        <label for="expertesa">Expertesa:</label>
        <input id="expertesa" [ngModel]="tribUpdate().expertesa"
            (ngModelChange)="updateField('expertesa', $event)" name="expertesa" />

        <label for="tutor">Tutor:</label>
        <input id="tutor" disabled [ngModel]="tribUpdate().tutor" name="tutor" />

        <label for="president">Presidència:</label>
        <mat-select id="president" [ngModel]="tribUpdate().president"
            (ngModelChange)="updateField('president', $event)" name="president">
            @for (docent of docOptions(); track docent.email) {
            <mat-option [value]="docent.name">
                {{ docent.name }}
            </mat-option>
            }
        </mat-select>
        <label for="vocal">Vocalia:</label>
        <mat-select id="vocal" [ngModel]="tribUpdate().vocal"
            (ngModelChange)="updateField('vocal', $event)" name="vocal">
            @for (docent of docOptions(); track docent.email) {
            <mat-option [value]="docent.name">
                {{ docent.name }}
            </mat-option>
            }
        </mat-select>

        <label for="data">Data i Hora:</label>
        <mat-select id="data" [ngModel]="selectedTimestamp()"
            (ngModelChange)="updateTimestamp($event)" name="data">
            @for (dispOption of dispOptions();
            track dispOption.timestamp) {
            <mat-option [value]="dispOption.timestamp">
                {{ dispOption.timestamp }}
            </mat-option>
            }
        </mat-select>

        <label for="clase">Aula:</label>
        <input id="clase" [ngModel]="tribUpdate().clase"
            (ngModelChange)="updateField('clase', $event)" name="clase" />
        <div class="tribunal-buttons">
            <button class="tribunal-button" type="submit">Guardar</button>
            <button class="tribunal-button" type="button" (click)="comprovar()">Comprovar</button>
            <button class="tribunal-button" type="button" (click)="closeDialog()">Cancela</button>
        </div>
    </form>
</div>
